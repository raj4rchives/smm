<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CartyWeb — Sign up</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f8f7fc}.auth{width:min(460px,calc(100% - 32px));background:#fff;border:1px solid #e5e3eb;border-radius:28px;padding:36px;box-shadow:0 25px 70px rgba(30,25,70,.08)}.auth .brand{justify-content:center;margin-bottom:30px}.auth h1{font-family:Manrope;font-size:38px;letter-spacing:-1.5px;margin:0 0 8px;text-align:center}.auth p{text-align:center;color:#9291a0;margin-bottom:28px}.auth label{display:block;font-size:12px;font-weight:700;margin:16px 0 8px}.auth input{width:100%;padding:14px;border:1px solid #dfdde7;border-radius:12px;font:inherit}.auth button{width:100%;margin-top:20px}.back{display:block;text-align:center;margin-top:20px;color:#6c5be4;text-decoration:none;font-size:14px}</style></head><body><div class="auth"><a class="brand" href="index.html"><span class="brand-mark"><i></i><i></i><i></i></span><span>Carty<span style="color:#6c5be4">Web</span></span></a><h1>Create your account.</h1><p>Start building and managing your website with CartyWeb.</p><form onsubmit="event.preventDefault();localStorage.setItem('cartyweb_logged_in','1');location.href='dashboard.html'"><label>Full name</label><input required placeholder="Your name"><label>Email</label><input type="email" required placeholder="you@example.com"><label>Password</label><input type="password" required placeholder="Create a password"><button class="btn btn-primary" type="submit">Create account →</button></form><a class="back" href="login.html">Already have an account? Log in</a><a class="back" href="index.html">← Back to CartyWeb</a></div></body></html>
